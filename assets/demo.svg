<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="849" viewBox="0 0 1080 849">
<rect width="1080" height="100%" rx="20" fill="#0b1018"/>
<rect x="1" y="1" width="1078" height="100%" rx="20" fill="none" stroke="#253044"/>
<text x="40" y="48" fill="#9fe8da" font-family="monospace" font-size="15" letter-spacing="5">NIVRA</text>
<text x="40" y="89" fill="#f2f5fa" font-family="sans-serif" font-size="28" font-weight="600">It worked. Then it broke. See what changed.</text>
<text x="40" y="116" fill="#8291a7" font-family="sans-serif" font-size="14">LOCAL DEVELOPMENT TIMELINE · REAL CLI OUTPUT · EARLY ALPHA</text>
<path d="M40 138H1040" stroke="#253044"/>
<text xml:space="preserve" x="40" y="169" fill="#9fe8da" font-family="Menlo,Consolas,monospace" font-size="15">$ nivra run -- grep -q working behavior.txt</text>
<text xml:space="preserve" x="40" y="192" fill="#a5d6b0" font-family="Menlo,Consolas,monospace" font-size="15">✓ Test passed</text>
<text xml:space="preserve" x="40" y="215" fill="#b4c0d2" font-family="Menlo,Consolas,monospace" font-size="15"></text>
<text xml:space="preserve" x="40" y="238" fill="#9fe8da" font-family="Menlo,Consolas,monospace" font-size="15">$ nivra mark working</text>
<text xml:space="preserve" x="40" y="261" fill="#d4b0ff" font-family="Menlo,Consolas,monospace" font-size="15">  ◆ Marked &quot;working&quot; · 0 changed file(s)</text>
<text xml:space="preserve" x="40" y="284" fill="#b4c0d2" font-family="Menlo,Consolas,monospace" font-size="15"></text>
<text xml:space="preserve" x="40" y="307" fill="#9fe8da" font-family="Menlo,Consolas,monospace" font-size="15">$ printf &quot;broken\n&quot; &gt; behavior.txt</text>
<text xml:space="preserve" x="40" y="330" fill="#b4c0d2" font-family="Menlo,Consolas,monospace" font-size="15"></text>
<text xml:space="preserve" x="40" y="353" fill="#9fe8da" font-family="Menlo,Consolas,monospace" font-size="15">$ nivra run -- grep -q working behavior.txt</text>
<text xml:space="preserve" x="40" y="376" fill="#f69ea6" font-family="Menlo,Consolas,monospace" font-size="15">✕ Test failed (exit 1)</text>
<text xml:space="preserve" x="40" y="399" fill="#b4c0d2" font-family="Menlo,Consolas,monospace" font-size="15"></text>
<text xml:space="preserve" x="40" y="422" fill="#9fe8da" font-family="Menlo,Consolas,monospace" font-size="15">$ nivra diff working now</text>
<text xml:space="preserve" x="40" y="445" fill="#f2f5fa" font-family="Menlo,Consolas,monospace" font-size="15">  N I V R A  /  working → now</text>
<text xml:space="preserve" x="40" y="468" fill="#b4c0d2" font-family="Menlo,Consolas,monospace" font-size="15"></text>
<text xml:space="preserve" x="40" y="491" fill="#b4c0d2" font-family="Menlo,Consolas,monospace" font-size="15">  Since &quot;working&quot;  ·  /tmp/nivra-demo/repo</text>
<text xml:space="preserve" x="40" y="514" fill="#b4c0d2" font-family="Menlo,Consolas,monospace" font-size="15"></text>
<text xml:space="preserve" x="40" y="537" fill="#b4c0d2" font-family="Menlo,Consolas,monospace" font-size="15">  Commands</text>
<text xml:space="preserve" x="40" y="560" fill="#a5d6b0" font-family="Menlo,Consolas,monospace" font-size="15">    + sh -c &#x27;printf &quot;broken\n&quot; &gt; behavior.txt&#x27;  ✓</text>
<text xml:space="preserve" x="40" y="583" fill="#f69ea6" font-family="Menlo,Consolas,monospace" font-size="15">    + grep -q working behavior.txt  ✕ exit 1</text>
<text xml:space="preserve" x="40" y="606" fill="#b4c0d2" font-family="Menlo,Consolas,monospace" font-size="15"></text>
<text xml:space="preserve" x="40" y="629" fill="#b4c0d2" font-family="Menlo,Consolas,monospace" font-size="15">  Git</text>
<text xml:space="preserve" x="40" y="652" fill="#b4c0d2" font-family="Menlo,Consolas,monospace" font-size="15">        M  behavior.txt  +1 -1</text>
<text xml:space="preserve" x="40" y="675" fill="#b4c0d2" font-family="Menlo,Consolas,monospace" font-size="15">           1 file, +1 -1</text>
<text xml:space="preserve" x="40" y="698" fill="#b4c0d2" font-family="Menlo,Consolas,monospace" font-size="15"></text>
<text xml:space="preserve" x="40" y="721" fill="#b4c0d2" font-family="Menlo,Consolas,monospace" font-size="15">  State</text>
<text xml:space="preserve" x="40" y="744" fill="#b4c0d2" font-family="Menlo,Consolas,monospace" font-size="15">    HEAD unchanged (9468c812)</text>
<text xml:space="preserve" x="40" y="767" fill="#b4c0d2" font-family="Menlo,Consolas,monospace" font-size="15">    branch unchanged (main)</text>
<text xml:space="preserve" x="40" y="790" fill="#b4c0d2" font-family="Menlo,Consolas,monospace" font-size="15"></text>
<text xml:space="preserve" x="40" y="813" fill="#b4c0d2" font-family="Menlo,Consolas,monospace" font-size="15">  Observed changes, not proof of causation.</text>
</svg>