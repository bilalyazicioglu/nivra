[package]
name = "nivra"
version = "0.1.0-alpha.1"
edition = "2024"
description = "See what changed between working and broken. A local development timeline."
license = "MIT"
repository = "https://github.com/bilalyazicioglu/nivra"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
