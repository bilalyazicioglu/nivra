[package]
name = "nivra"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "See what changed between working and broken. A local development timeline."
license = "MIT"
repository = "https://github.com/bilalyazicioglu/nivra"
readme = "README.md"
keywords = ["cli", "developer-tools", "git", "debugging", "timeline"]
categories = ["command-line-utilities", "development-tools::debugging"]
publish = ["crates-io"]
include = [
    "/src/**",
    "/scripts/nivra.zsh",
    "/assets/demo.svg",
    "/tests/cli.rs",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
